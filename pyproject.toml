[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memforge"
version = "1.0.0"
description = "Local-first persistent memory and context engineering platform for AI agents (Milestone 5: agent integration and MCP)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MemForge contributors" }]
keywords = ["ai-agents", "memory", "context-engineering", "fastapi", "sqlite", "local-first", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "uvicorn>=0.27",
  "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "mypy>=1.10",
  "ruff>=0.5",
  "pytest-cov>=5.0",
]

[project.scripts]
memforge-demo = "app.cli.demo:main"
memforge-mcp = "app.mcp.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"] # line length is enforced by the formatter configuration below

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "."
packages = ["app", "tests"]
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
